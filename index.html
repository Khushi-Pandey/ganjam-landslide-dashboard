<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ganjam Damage | BhoomiCam</title>
<meta name="description" content="Satellite damage assessment of the Ganjam landslide, Odisha, by BhoomiCam.">
<link rel="icon" href="img/Bhoomicam_Logo_Green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="stage">
    <div id="map" class="map"></div>
    <div class="event" id="event" aria-live="polite" hidden></div>
    <div class="loading" id="loading" hidden><span class="spin"></span><span id="loadingText">Loading images</span></div>
    <div class="coord" id="coord" aria-hidden="true"></div>
  </main>

  <aside class="side">
    <header class="brand">
      <a href="https://www.bhoomicam.com" aria-label="BhoomiCam website"><img src="img/Bhoomicam_Logo_Green.png" alt="BhoomiCam"></a>
      <div><h1>Ganjam landslide</h1><p>Odisha. Storm of 28 Oct 2026</p></div>
    </header>
    <section>
      <h2>Basemap</h2>
      <div class="bases" id="bases" role="radiogroup" aria-label="Basemap"></div>
      <div class="baselegend" id="baselegend"></div>
    </section>
    <section>
      <h2>Layers</h2>
      <div id="layers"></div>
    </section>
    <footer class="foot">
      <a href="dl/damage_patches.geojson" download>Damage patches (GeoJSON)</a>
      <a href="dl/radar_passes.csv" download>Radar passes (CSV)</a>
      <p>Sentinel-1 and Sentinel-2: Copernicus. PlanetScope: Planet. Satellite basemap: Esri.</p>
    </footer>
  </aside>

  <section class="dock" aria-label="Timeline and charts">
    <div class="tl">
      <div class="tlhead">
        <button class="play" id="play" type="button" aria-label="Play"></button>
        <button class="speed" id="speed" type="button" aria-label="Playback speed">1x</button>
        <div class="when"><b id="date"></b><span id="rain"></span></div>
      </div>
      <div class="track" id="track"></div>
    </div>
    <div class="info">
      <div class="kpis" id="kpis"></div>
      <div class="charts">
        <div class="chart"><h3>Land hit on 30 Oct</h3><div id="lulc"></div></div>
        <div class="chart"><h3>Radar signal (dB), every pass</h3><div id="passes"></div></div>
      </div>
    </div>
  </section>
</div>
<div class="tip" id="tip" hidden></div>
<script src="vendor/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
